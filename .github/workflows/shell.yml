name: Shell validation

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validate shell syntax
        run: |
          bash -n deploy.sh
          bash -n tge/bin/tge
          bash -n tests/test_repository_bridge.sh
      - name: Check whitespace
        run: git diff --check
      - name: Run repository bridge tests
        run: bash tests/test_repository_bridge.sh
